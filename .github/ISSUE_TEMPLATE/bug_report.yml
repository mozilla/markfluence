name: Bug report
description: Something markfluence did wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security vulnerability, **don't file it here** — report it
        privately via [Report a vulnerability](https://github.com/mozilla/markfluence/security/advisories/new).
        See [SECURITY.md](https://github.com/mozilla/markfluence/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead.
      placeholder: |
        `update` skipped a file I had just edited, reporting it as unchanged.
        I expected it to publish, since the file is newer than the page.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The command and its output
      description: >
        The command you ran and what it printed, in a ``` code block. Re-running
        with `--debug` shows the requests, which is usually the thing that
        identifies the bug.
      placeholder: |
        ```console
        $ markfluence update docs/runbook.md --debug
        ...
        ```
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `markfluence --version`.
      placeholder: markfluence 0.1.0 (abc1234, 2026-08-22)
    validations:
      required: true

  - type: dropdown
    id: flavor
    attributes:
      label: Which Confluence?
      description: >
        The API differs between them, and a bug is often specific to one.
      options:
        - Cloud (an atlassian.net site)
        - Cloud, via a scoped token and the api.atlassian.com gateway
        - Data Center or Server (self-hosted)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: markdown
    attributes:
      label: The markdown, if it's relevant
      description: >
        For a conversion or publishing bug, the smallest file that shows it —
        frontmatter included, since `page_id`, `space`, and `parent` change what
        the command does. Replace anything private; a made-up page id is fine.
      render: markdown
    validations:
      required: false

  - type: checkboxes
    id: no-credentials
    attributes:
      label: Before you submit
      options:
        - label: >
            I've checked that there's no API token in what I pasted. (`--debug`
            output includes request details; the token isn't printed, but paste
            with a look anyway.)
          required: true
