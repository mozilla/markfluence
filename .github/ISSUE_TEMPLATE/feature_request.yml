name: Feature request
description: Something markfluence should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describing the problem is more useful than describing a solution — the
        workflow you're stuck on usually suggests a better fit for the tool than
        the flag that first comes to mind.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        The task, not the feature. What are you publishing, and what stops you?
      placeholder: |
        I keep a directory of runbooks and want CI to publish only the ones that
        changed in a push. Right now I have to list the files by hand.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you want it to do?
      description: >
        If you have a shape in mind — a command, a flag, a frontmatter field —
        sketch it. A rough guess is fine and doesn't commit you to it.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How are you working around it now?
      description: >
        A script, another tool, or doing it by hand. This is what tells us
        whether the feature is a convenience or the difference between usable
        and not.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Related issues, prior discussion, or a Confluence quirk behind it.
    validations:
      required: false
