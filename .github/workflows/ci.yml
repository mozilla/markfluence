name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required so the checks report back for merge-queue entries: the queue runs
  # workflows on a temporary branch via the merge_group event, not pull_request.
  merge_group:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # One target rather than a step each, so what CI gates on and what a
      # developer runs before pushing cannot drift apart. See `make check`.
      - name: Check
        run: make check
