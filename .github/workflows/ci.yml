name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required so the checks report back for merge-queue entries: the queue runs
  # workflows on a temporary branch via the merge_group event, not pull_request.
  merge_group:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: make vet

      - name: Format check
        run: make fmt-check

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Lint
        run: make lint
