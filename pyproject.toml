[project]
name = "markfluence"
version = "0.1.0"
description = "CLI for publishing and manipulating Confluence pages and attachments."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "click",
    "python-dotenv",
    "httpx2",
    "marko",
]

[project.scripts]
markfluence = "markfluence.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markfluence"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# libmarkdown.py holds the verbatim-ported conversion logic; its long
# docstrings/comments/f-strings are left as-is.
"src/markfluence/libmarkdown.py" = ["E501"]
