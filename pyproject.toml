[project]
name = "mzcld-confluence-cli"
version = "0.1.0"
description = "CLI for publishing and manipulating Confluence pages and attachments."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "click",
    "python-dotenv",
    "httpx2",
    "marko",
]

[project.scripts]
mzcld-confluence-cli = "mzcld_confluence_cli.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mzcld_confluence_cli"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
# The legacy standalone script is kept untouched alongside the package.
extend-exclude = ["confluence_publish.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# libmarkdown.py holds the conversion logic ported verbatim from
# confluence_publish.py; its long docstrings/comments/f-strings are left as-is.
"src/mzcld_confluence_cli/libmarkdown.py" = ["E501"]

[tool.ty.src]
# The legacy standalone script carries its own inline (PEP 723) deps and is kept
# untouched; don't typecheck it against the package's environment.
exclude = ["confluence_publish.py"]
