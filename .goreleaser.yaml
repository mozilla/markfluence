version: 2
project_name: markfluence
dist: dist

before:
  hooks:
    - go mod tidy
    # Writes ./completions/markfluence.{bash,zsh,fish}, packaged below. They are
    # generated from the CLI, so they always match this build's commands.
    - make completions

builds:
  - id: markfluence
    main: .
    binary: markfluence
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    # All four, deliberately: darwin/amd64 used to be ignored, which made the
    # generated Homebrew cask carry no on_intel block at all, so `brew install
    # markfluence` failed outright on an Intel Mac. Since this repo is its own
    # tap (#1), the build matrix *is* the install matrix -- a platform missing
    # here is a platform brew cannot serve. It also covers the macos-13 runner
    # for #29's action.
    ldflags:
      - -s -w
      - -X github.com/mozilla/markfluence/internal/buildinfo.Version={{.Version}}

archives:
  - id: markfluence
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Naming `files` replaces goreleaser's defaults, so the license and readme
    # are listed again alongside the completions.
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: "checksums.txt"

release:
  # Created as a draft and published by release.yml only after every asset has
  # uploaded. goreleaser creates the release *before* uploading, and
  # /releases/latest is the most recent published non-prerelease whether or
  # not its assets are complete -- so without this, a run that dies mid-upload
  # becomes the release that `latest` resolves to, and anything pinned there
  # 404s on the archive. #29's action defaults to `latest`.
  draft: true
  # Required, and not the default (which is `false`). Without it an RC tag
  # produces a NON-prerelease draft, and release.yml publishes every draft
  # unconditionally -- so `v0.1.0-rc.1`, which docs/releasing.md blesses as
  # the way to rehearse, would become /releases/latest. That is the precise
  # outcome `draft` exists to prevent, arrived at from the other direction.
  # The cask is skipped for an RC either way (skip_upload: "auto" reads the
  # parsed semver rather than this), which is what made the gap easy to miss.
  prerelease: auto

snapshot:
  version_template: "{{ .Tag }}-{{ .ShortCommit }}-SNAPSHOT"

changelog:
  use: github
  sort: asc

# Homebrew cask. **This repository is its own tap** (#1): the generated cask
# lands in ./Casks here rather than in a separate mozilla/homebrew-markfluence,
# which is how mozilla/mozcloud does it and is what makes the token work.
# GitHub Actions' automatic GITHUB_TOKEN is scoped to the repository the
# workflow runs in, so a *separate* tap repo would need a fine-grained PAT
# someone has to own and rotate; a same-repo write needs only `contents:
# write` on the release job.
#
# **The release pushes a branch and stops. A human opens the PR.** This is the
# one non-obvious thing here and it is not a style preference -- a release
# cannot merge the cask itself:
#
#   - main's ruleset requires the `ci` status check, with an empty
#     bypass_actors and current_user_can_bypass = never. Nobody can force it.
#   - GitHub does not start workflow runs for events triggered by the
#     automatic GITHUB_TOKEN, so a PR goreleaser opens never runs `ci` and
#     therefore can never satisfy the check. Measured, not deduced:
#     mozilla/mozcloud does open its formula PRs this way and they merge with
#     an empty check list, because *its* ruleset requires no status check.
#     This repo's does.
#
# The ruleset only protects the **default branch**, though, so pushing
# `goreleaser/cask-<tag>` is fine. So goreleaser commits the cask to that
# branch and nothing else; a person then runs
#
#     gh pr create --head goreleaser/cask-v0.1.0
#
# which, being a human-triggered event, does run `ci` and can merge normally.
# One command per release, no credential to own, and main's ruleset unchanged.
# Do not add `pull_request: {enabled: true}` back without also solving the
# check problem -- it produces a PR that looks right and can never land.
#
# The cost is the tap incantation, since the repo is not named
# `homebrew-markfluence`: `brew tap` takes an explicit URL in that case.
#
#     brew tap mozilla/markfluence https://github.com/mozilla/markfluence
#     brew install markfluence
#
# A cask rather than a formula because goreleaser removed `brews:` in v2.16 —
# the formulas it used to generate for pre-built binaries were, in its own
# words, "hackyish". A cask is the supported way to ship a compiled binary.
#
# The cask is the **macOS** path and the README documents it as nothing else.
# Homebrew runs on Linux, but Cask is a macOS feature -- `brew` there has
# refused casks outright -- and while the artifact here is a `binary` stanza,
# which Homebrew documents as portable, nobody has tested it and no
# instruction depends on it. goreleaser emits the on_linux blocks regardless;
# they are harmless and unused. Linux users get the release archive.
homebrew_casks:
  - name: markfluence
    homepage: "https://github.com/mozilla/markfluence"
    description: "CLI for publishing and manipulating Confluence pages from markdown"
    directory: Casks
    # "auto" skips the cask for a prerelease tag. Without it a v0.1.0-rc.1 --
    # which docs/releasing.md blesses as the way to rehearse a release --
    # bumps the cask, and `brew install markfluence` hands users a release
    # candidate.
    skip_upload: "auto"
    repository:
      owner: mozilla
      name: markfluence
      token: "{{ .Env.GITHUB_TOKEN }}"
      # Never main: the branch is the deliverable, the PR is a human's job.
      branch: "goreleaser/cask-{{ .Tag }}"
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
    commit_msg_template: "chore: bump markfluence cask to {{ .Tag }}"
    # Paths within the extracted archive; the cask installs them where each
    # shell looks, so a brew install completes out of the box.
    completions:
      bash: completions/markfluence.bash
      zsh: completions/markfluence.zsh
      fish: completions/markfluence.fish
    # The binary is not signed or notarized, so macOS quarantines it on
    # download and the first run dies with "cannot be opened because the
    # developer cannot be verified". Stripping the attribute at install time is
    # goreleaser's own documented answer for an unsigned cask.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/markfluence"]
          end
